# The one Secret per workload (spec 0015, Secrets per workload). The chart
# renders each as a SealedSecret from the cluster's sealed-values.yaml and
# fails when a required key is missing; the installer (internal/install)
# builds and seals exactly these keys from the cluster's secrets.env. A Go
# test (AC-7) fails when a Secret with a loader differs from the secret and
# private fields that loader's config struct declares, in either direction.
#
# Per key:
#   optional: true   sealed only when its source is set
#   demo: true|false only when demo.enabled matches (absent: always)
#   from: NAME       the secrets.env setting that holds the value (default: the key)
#   value: text      a fixed value (a role name)
#   derive: database_url, with role and password (a secrets.env name): the
#                    role's URL to noord-pg (database below)
#
# generated: values the installer makes once with crypto/rand when
# secrets.env lacks them and no live Secret holds them (AC-5). Letters and
# digits only, with at least one upper, lower, and digit, so they meet
# Samba's complexity rule and need no escaping in a URL.

database:
  host: noord-pg-rw.noord-agent.svc
  port: 5432
  name: noord
  caPath: /etc/noord/pg-ca/ca.crt

generated:
  TOOLSERVER_TOKEN: {length: 48}
  PG_OWNER_PASSWORD: {length: 32}
  PG_AGENT_PASSWORD: {length: 32}
  PG_TOOLSERVER_PASSWORD: {length: 32}
  PG_EVAL_PASSWORD: {length: 32}
  ZAMMAD_TOKEN: {length: 43, demo: true}
  LDAP_BIND_PASSWORD: {length: 32, demo: true}

secrets:
  noord-agent:
    namespace: noord-agent
    component: agent
    loader: agent
    keys:
      TOOLSERVER_TOKEN: {}
      AGENT_DATABASE_URL: {derive: database_url, role: noord_agent, password: PG_AGENT_PASSWORD}
      SLACK_BOT_TOKEN: {optional: true}
      SLACK_APP_TOKEN: {optional: true}
      SLACK_IT_CHANNEL: {optional: true}
      ANTHROPIC_API_KEY: {optional: true}
      AWS_ACCESS_KEY_ID: {optional: true}
      AWS_SECRET_ACCESS_KEY: {optional: true}

  noord-toolserver:
    namespace: noord-agent
    component: agent
    loader: toolserver
    keys:
      TOOLSERVER_TOKEN: {}
      TOOLSERVER_DATABASE_URL: {derive: database_url, role: noord_toolserver, password: PG_TOOLSERVER_PASSWORD}
      LDAP_URL: {demo: false}
      LDAP_BASE_DN: {}
      LDAP_BIND_DN: {}
      LDAP_BIND_PASSWORD: {}
      ZAMMAD_URL: {demo: false}
      ZAMMAD_TOKEN: {}
      ZAMMAD_PUBLIC_URL: {optional: true}
      SLACK_IT_APPROVERS: {optional: true}
      GRAPH_TENANT_ID: {optional: true}
      GRAPH_CLIENT_ID: {optional: true}
      GRAPH_CLIENT_SECRET: {optional: true}
      RESET_PUBLIC_URL: {optional: true}
      RESET_LDAP_BIND_DN: {optional: true}
      RESET_LDAP_BIND_PASSWORD: {optional: true}

  noord-migrate:
    namespace: noord-agent
    component: agent
    loader: migrate
    keys:
      MIGRATE_DATABASE_URL: {derive: database_url, role: noord_owner, password: PG_OWNER_PASSWORD}

  noord-pg-owner:
    namespace: noord-agent
    component: agent
    type: kubernetes.io/basic-auth
    keys:
      username: {value: noord_owner}
      password: {from: PG_OWNER_PASSWORD}

  noord-pg-agent:
    namespace: noord-agent
    component: agent
    type: kubernetes.io/basic-auth
    keys:
      username: {value: noord_agent}
      password: {from: PG_AGENT_PASSWORD}

  noord-pg-toolserver:
    namespace: noord-agent
    component: agent
    type: kubernetes.io/basic-auth
    keys:
      username: {value: noord_toolserver}
      password: {from: PG_TOOLSERVER_PASSWORD}

  noord-pg-eval:
    namespace: noord-agent
    component: agent
    type: kubernetes.io/basic-auth
    keys:
      username: {value: noord_eval}
      password: {from: PG_EVAL_PASSWORD}
