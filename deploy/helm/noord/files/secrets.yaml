# The one Secret per workload (spec 0015, Secrets per workload). The chart
# renders each as a SealedSecret from the cluster's sealed-values.yaml and
# fails when a required key is missing; the installer (internal/install)
# builds and seals exactly these keys from the cluster's secrets.env. A Go
# test (AC-7) fails when a Secret with a loader differs from the secret and
# private fields that loader's config struct declares, in either direction.
#
# Per key:
#   optional: true   sealed only when its source is set
#   demo: true|false only when demo.enabled matches (absent: always)
#   reset: true|false only when reset.enabled (the reset page) matches
#   from: NAME       the secrets.env setting that holds the value (default: the key)
#   value: text      a fixed value (a role name)
#   derive: database_url, with role and password (a secrets.env name): the
#                    role's URL to noord-pg (database below)
#   derive: tailnet_url, with host (reset): https://<host>.<TAILNET>, the
#                    host from the cluster's values (AC-15)
#   file: NAME       a file in ~/.noord/<cluster>/, the cluster's own cert
#                    dir that never enters the repo (the Samba server pair)
#   fromFile: NAME   the content of the local file whose path that
#                    secrets.env setting holds; the chart mounts the key as a
#                    file, never as an environment variable (AC-24)
#   rails: true      read by the Zammad image's Rails (the helpdesk Job's
#                    database and Redis passwords), not by our loader, so the
#                    AC-7 test leaves it out
#
# generated: values the installer makes once with crypto/rand when
# secrets.env lacks them and no live Secret holds them (AC-5). Letters and
# digits only, with at least one upper, lower, and digit, so they meet
# Samba's complexity rule and need no escaping in a URL.

database:
  host: noord-pg-rw.noord-agent.svc
  port: 5432
  name: noord
  caPath: /etc/noord/pg-ca/ca.crt

generated:
  TOOLSERVER_TOKEN: {length: 48}
  PG_OWNER_PASSWORD: {length: 32}
  PG_AGENT_PASSWORD: {length: 32}
  PG_TOOLSERVER_PASSWORD: {length: 32}
  PG_EVAL_PASSWORD: {length: 32}
  ZAMMAD_TOKEN: {length: 43, demo: true}
  LDAP_BIND_PASSWORD: {length: 32, demo: true}
  SEED_ADMIN_PASSWORD: {length: 32, demo: true}
  SEED_USER_PASSWORD: {length: 32, demo: true}
  SEED_ZAMMAD_BIND_PASSWORD: {length: 32, demo: true}
  SEED_ENTRA_DEMO_PASSWORD: {length: 32, demo: true}
  SEED_ZAMMAD_ADMIN_PASSWORD: {length: 32, demo: true}
  RESET_LDAP_BIND_PASSWORD: {length: 32, demo: true}
  ZAMMAD_POSTGRES_PASSWORD: {length: 32, demo: true}
  ZAMMAD_REDIS_PASSWORD: {length: 32, demo: true}

secrets:
  noord-agent:
    namespace: noord-agent
    component: agent
    loader: agent
    keys:
      TOOLSERVER_TOKEN: {}
      AGENT_DATABASE_URL: {derive: database_url, role: noord_agent, password: PG_AGENT_PASSWORD}
      SLACK_BOT_TOKEN: {optional: true}
      SLACK_APP_TOKEN: {optional: true}
      SLACK_IT_CHANNEL: {optional: true}
      ANTHROPIC_API_KEY: {optional: true}
      AWS_ACCESS_KEY_ID: {optional: true}
      AWS_SECRET_ACCESS_KEY: {optional: true}

  noord-toolserver:
    namespace: noord-agent
    component: agent
    loader: toolserver
    keys:
      TOOLSERVER_TOKEN: {}
      TOOLSERVER_DATABASE_URL: {derive: database_url, role: noord_toolserver, password: PG_TOOLSERVER_PASSWORD}
      LDAP_URL: {demo: false}
      LDAP_BASE_DN: {}
      LDAP_BIND_DN: {}
      LDAP_BIND_PASSWORD: {}
      ZAMMAD_URL: {demo: false}
      ZAMMAD_TOKEN: {}
      ZAMMAD_PUBLIC_URL: {optional: true}
      SLACK_IT_APPROVERS: {optional: true}
      GRAPH_TENANT_ID: {optional: true}
      GRAPH_CLIENT_ID: {optional: true}
      GRAPH_CLIENT_SECRET: {optional: true}
      # The Graph app's certificate and key, mounted at GRAPH_CLIENT_CERT;
      # set GRAPH_CERT_FILE or GRAPH_CLIENT_SECRET, not both (AC-24).
      graph-client.pem: {fromFile: GRAPH_CERT_FILE, optional: true}
      # The reset page (spec 0011), on whenever reset.enabled is.
      RESET_PUBLIC_URL: {derive: tailnet_url, host: reset, reset: true}
      RESET_LDAP_BIND_DN: {reset: true}
      RESET_LDAP_BIND_PASSWORD: {reset: true}

  noord-migrate:
    namespace: noord-agent
    component: agent
    loader: migrate
    keys:
      MIGRATE_DATABASE_URL: {derive: database_url, role: noord_owner, password: PG_OWNER_PASSWORD}

  # The smoke check (AC-17): the token for the tool server's report and
  # tools/list, and the owner's URL to read goose_db_version.
  noord-smoke:
    namespace: noord-agent
    component: agent
    loader: smoke
    keys:
      TOOLSERVER_TOKEN: {}
      MIGRATE_DATABASE_URL: {derive: database_url, role: noord_owner, password: PG_OWNER_PASSWORD}

  # Backups (AC-18): the bucket token and region the ObjectStore reads. Only
  # with backup.enabled.
  noord-backup:
    namespace: noord-agent
    component: agent
    backup: true
    keys:
      BACKUP_S3_ACCESS_KEY_ID: {}
      BACKUP_S3_SECRET_ACCESS_KEY: {}
      BACKUP_S3_REGION: {}

  noord-pg-owner:
    namespace: noord-agent
    component: agent
    type: kubernetes.io/basic-auth
    keys:
      username: {value: noord_owner}
      password: {from: PG_OWNER_PASSWORD}

  noord-pg-agent:
    namespace: noord-agent
    component: agent
    type: kubernetes.io/basic-auth
    keys:
      username: {value: noord_agent}
      password: {from: PG_AGENT_PASSWORD}

  noord-pg-toolserver:
    namespace: noord-agent
    component: agent
    type: kubernetes.io/basic-auth
    keys:
      username: {value: noord_toolserver}
      password: {from: PG_TOOLSERVER_PASSWORD}

  noord-pg-eval:
    namespace: noord-agent
    component: agent
    type: kubernetes.io/basic-auth
    keys:
      username: {value: noord_eval}
      password: {from: PG_EVAL_PASSWORD}

  # Samba must know its own accounts' passwords (spec 0015, key invariants).
  # svc-pwreset exists only when the reset feature is on; Samba makes it
  # only when it provisions the domain, so turning reset on later needs a
  # directory reset (AC-28).
  noord-samba:
    namespace: noord-directory
    component: directory
    keys:
      SAMBA_ADMIN_PASSWORD: {from: SEED_ADMIN_PASSWORD}
      SAMBA_SVC_PASSWORD: {from: LDAP_BIND_PASSWORD}
      SAMBA_ZAMMAD_PASSWORD: {from: SEED_ZAMMAD_BIND_PASSWORD}
      SAMBA_PWRESET_PASSWORD: {from: RESET_LDAP_BIND_PASSWORD, reset: true}
      tls.crt: {file: server.pem}
      tls.key: {file: server.key}

  # seed directory and seed entra sync. SEED_ZAMMAD_BIND_PASSWORD is here
  # because seed directory refuses to run without it (spec 0006).
  noord-seed-directory:
    namespace: noord-directory
    component: directory
    loader: seed
    keys:
      SEED_ADMIN_USER: {}
      SEED_ADMIN_PASSWORD: {}
      SEED_USER_PASSWORD: {}
      SEED_ZAMMAD_BIND_PASSWORD: {}
      SEED_GRAPH_TENANT_ID: {optional: true}
      SEED_GRAPH_CLIENT_ID: {optional: true}
      SEED_GRAPH_CLIENT_SECRET: {optional: true}
      SEED_ENTRA_DOMAIN: {optional: true}
      SEED_ENTRA_DEMO_PASSWORD: {optional: true}

  # seed helpdesk, on the Zammad image (AC-11). No directory admin or seed
  # user password: it only binds as svc-zammad. ZAMMAD_URL is the chart's
  # in demo mode; the key keeps the AC-7 test exact.
  noord-seed-helpdesk:
    namespace: noord-client
    component: client
    loader: seedhelpdesk
    keys:
      SEED_ZAMMAD_BIND_PASSWORD: {}
      SEED_ZAMMAD_ADMIN_EMAIL: {optional: true}
      SEED_ZAMMAD_ADMIN_PASSWORD: {}
      ZAMMAD_TOKEN: {}
      ZAMMAD_URL: {demo: false}
      ZAMMAD_PUBLIC_URL: {}   # https://<helpdesk host>.<TAILNET>; the fqdn Zammad links to
      ZAMMAD_POSTGRES_PASSWORD: {rails: true}
      ZAMMAD_REDIS_PASSWORD: {rails: true}

  # The Zammad chart's existingSecret for its Postgres and Redis, so it
  # renders no Secret of its own (AC-6). Key names are the subcharts'.
  noord-zammad:
    namespace: noord-client
    component: client
    keys:
      postgres-password: {from: ZAMMAD_POSTGRES_PASSWORD}
      redis-password: {from: ZAMMAD_REDIS_PASSWORD}
