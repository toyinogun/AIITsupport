# Defaults for every cluster. A cluster's own deploy/clusters/<name>/values.yaml
# and sealed-values.yaml are layered on top by its ArgoCD Applications; edit
# those, not this file, to tune one cluster (spec 0015).

# Which part this render holds: agent, directory, or client. Set by the
# Application, never by hand.
component: ""

cluster:
  name: ""
  # The ranges the network policies keep internal (AC-14); make cluster-init
  # fills them from the live cluster. Pod and service default to k3s's.
  podCIDR: 10.42.0.0/16
  serviceCIDR: 10.43.0.0/16
  nodeCIDR: ""        # the nodes' addresses
  apiServerCIDR: ""   # the kube API's address, /32

# The cluster's CNI. On Cilium the database's kube API allow is an entity
# rule (an ipBlock never matches a node address there), and fqdnEgress
# narrows each workload's TCP 443 to the hosts it uses.
cilium:
  enabled: false
  fqdnEgress: false

# Where the Tailscale operator runs its Ingress proxies (AC-14).
tailscale:
  proxyNamespace: tailscale

image:
  registry: ghcr.io
  owner: ""
  tag: ""        # the full git SHA CI pushed (AC-19); never latest
  pullPolicy: IfNotPresent

demo:
  enabled: true

# The password reset page (spec 0011): the tool server's reset listener on
# its own port, reachable only through a tailnet Ingress (AC-15).
reset:
  enabled: true
  # The page's tailnet host; empty means noord-<cluster>-reset.
  tailscaleHost: ""
  port: 8081

# The CA that signs the directory's LDAPS certificate: ours in demo mode,
# the client's otherwise. Public; rendered as the ConfigMap noord-ca.
ca:
  certificate: ""

# The sealed blocks, one per Secret in files/secrets.yaml (sealed-values.yaml).
sealed: {}

# The operators the bootstrap chart installs; the chart reads only whether
# Tailscale is on, for its operator's Secret (AC-4).
platform:
  tailscale:
    enabled: false

# make pause sets this: the agent at 0 replicas and no seed Jobs rendered
# (AC-20). make resume clears it.
paused: false

# make resume bumps this so every seed step runs once more (AC-20).
seedRun: 0

# Shared by the agent's purge and the helpdesk seed (spec 0010, AC-13).
ticketRetentionDays: 30
logLevel: info

postgres:
  image: ghcr.io/cloudnative-pg/postgresql:17.6-system-trixie@sha256:6ae4a22c14bdc66e5feaafd38d12c3956fabf9ce9582189e6aa4ee767d981d1b
  instances: 1
  storage:
    size: 5Gi
  storageClass: ""   # empty: the cluster's default StorageClass
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

# Backups of noord-pg (AC-18): WAL archiving and a daily base backup through
# the Barman Cloud plugin, to s3://<bucket>/<cluster>/ at endpoint. The token
# and region are sealed (noord-backup); the endpoint and bucket are not
# secret, and the ObjectStore takes them only as plain fields.
backup:
  enabled: false
  endpoint: ""   # https://<account>.eu.r2.cloudflarestorage.com on k3sprox
  bucket: ""
  retention: 14d
  # CNPG's six field cron (seconds first): 02:00 UTC daily.
  schedule: "0 0 2 * * *"

# The kill switch starts read only; flip it with kubectl (AC-9), never in git.
killSwitch:
  initial: read_only

migrate:
  waitTimeout: 5m
  backoffLimit: 6
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# The smoke check (AC-17), run on demand from the suspended CronJob.
smoke:
  timeout: 1m
  ttlSecondsAfterFinished: 3600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

toolserver:
  replicas: 1
  zammadDefaultGroup: IT Support
  # Other non secret settings by name, defaults from internal/config.
  env: {}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

agent:
  replicas: 1
  # Above AGENT_SHUTDOWN_GRACE (25s) so a running turn can finish (spec 0008).
  terminationGracePeriodSeconds: 40
  env: {}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

directory:
  samba:
    realm: AD.NOORD.EXAMPLE
    domain: NOORD
    lockout:
      threshold: 5
      duration: 15
      window: 15
    storage:
      size: 1Gi
    storageClass: ""   # empty: the cluster's default StorageClass
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  seed:
    waitTimeout: 5m
    backoffLimit: 6
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

# The demo helpdesk (component client, AC-10, AC-11): our Elasticsearch, the
# helpdesk seed Job, and the tailnet host of Zammad's web UI.
helpdesk:
  # The UI's tailnet host; empty means noord-<cluster>-helpdesk (AC-15).
  tailscaleHost: ""
  elasticsearch:
    image: elasticsearch:9.5.5
    heap: 1g
    storage:
      size: 5Gi
    storageClass: ""   # empty: the cluster's default StorageClass
    resources:
      requests: {cpu: 250m, memory: 1536Mi}
      limits: {cpu: "2", memory: 2Gi}
  seed:
    waitTimeout: 15m
    # A failed step leaves Zammad half seeded, so a retry only finds
    # needs_reset; the seed waits for Samba and Zammad itself.
    backoffLimit: 0
    # Zammad's Rails sizes: the seed runs Rails in process.
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    exportResources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

# The Zammad chart 20.0.0 (charts/), rendered only by the client Application,
# which sets enabled. Its own Postgres, Redis, and Memcached read their
# passwords from noord-zammad; ECK Elasticsearch and RustFS stay off.
zammad:
  enabled: false
  # Names the web Service zammad-nginx (the tool server's ZAMMAD_URL).
  fullnameOverride: zammad
  image:
    tag: 7.2.2-0012   # the chart's appVersion, pinned here so the seed Job runs the same image
  # Zammad after its databases (wave 0), before the seed Job (wave 2).
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "1"
  secrets:
    postgresql:
      useExisting: true
      secretName: noord-zammad
      secretKey: postgres-password
    redis:
      useExisting: true
      secretName: noord-zammad
      secretKey: redis-password
  zammadConfig:
    elasticsearch:
      enabled: false
      host: elasticsearch
      port: 9200
      schema: http
      initialisation: true
    rustfs:
      enabled: false
    postgresql:
      pass: ""
    redis:
      pass: ""
    initContainers:
      # A privileged root chmod of an emptyDir; baseline refuses it and
      # fsGroup already makes the tmp dir writable (AC-12).
      volumePermissions:
        enabled: false
    # Zammad's init runs as an ArgoCD hook on every sync: its name never
    # changes under ArgoCD, so as a plain Job a TTL delete would make it
    # drift and an image bump would hit its immutable spec.
    initJob:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # The demo CA for Zammad's LDAPS (the scheduler's LDAP sync included).
    customVolumes:
      - name: noord-ca
        configMap:
          name: noord-ca
          items:
            - {key: ca.crt, path: ca.pem}
    customVolumeMounts:
      - name: noord-ca
        mountPath: /opt/noord-seed
        readOnly: true
  postgres:
    auth:
      existingSecret: noord-zammad
      secretKeys:
        adminPasswordKey: postgres-password
  redis:
    auth:
      existingSecret: noord-zammad
      existingSecretPasswordKey: redis-password
