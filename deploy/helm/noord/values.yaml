# Defaults for every cluster. A cluster's own deploy/clusters/<name>/values.yaml
# and sealed-values.yaml are layered on top by its ArgoCD Applications; edit
# those, not this file, to tune one cluster (spec 0015).

# Which part this render holds: agent, directory, or client. Set by the
# Application, never by hand.
component: ""

cluster:
  name: ""
  # The ranges the network policies keep internal (AC-14); make cluster-init
  # fills them from the live cluster. Pod and service default to k3s's.
  podCIDR: 10.42.0.0/16
  serviceCIDR: 10.43.0.0/16
  nodeCIDR: ""        # the nodes' addresses
  apiServerCIDR: ""   # the kube API's address, /32

# The cluster's CNI. On Cilium the database's kube API allow is an entity
# rule (an ipBlock never matches a node address there), and fqdnEgress
# narrows each workload's TCP 443 to the hosts it uses.
cilium:
  enabled: false
  fqdnEgress: false

# Where the Tailscale operator runs its Ingress proxies (AC-14).
tailscale:
  proxyNamespace: tailscale

image:
  registry: ghcr.io
  owner: ""
  tag: ""        # the full git SHA CI pushed (AC-19); never latest
  pullPolicy: IfNotPresent

demo:
  enabled: true

# The password reset page (spec 0011): the tool server's reset listener on
# its own port, reachable only through a tailnet Ingress (AC-15).
reset:
  enabled: true
  # The page's tailnet host; empty means noord-<cluster>-reset.
  tailscaleHost: ""
  port: 8081

# The CA that signs the directory's LDAPS certificate: ours in demo mode,
# the client's otherwise. Public; rendered as the ConfigMap noord-ca.
ca:
  certificate: ""

# The sealed blocks, one per Secret in files/secrets.yaml (sealed-values.yaml).
sealed: {}

# The operators the bootstrap chart installs; the chart reads only whether
# Tailscale is on, for its operator's Secret (AC-4).
platform:
  tailscale:
    enabled: false

# make pause sets this: the agent at 0 replicas and no seed Jobs rendered
# (AC-20). make resume clears it.
paused: false

# make resume bumps this so every seed step runs once more (AC-20).
seedRun: 0

# Shared by the agent's purge and the helpdesk seed (spec 0010, AC-13).
ticketRetentionDays: 30
logLevel: info

postgres:
  image: ghcr.io/cloudnative-pg/postgresql:17.6-system-trixie@sha256:6ae4a22c14bdc66e5feaafd38d12c3956fabf9ce9582189e6aa4ee767d981d1b
  instances: 1
  storage:
    size: 5Gi
  storageClass: ""   # empty: the cluster's default StorageClass
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

# Backups of noord-pg (AC-18): WAL archiving and a daily base backup through
# the Barman Cloud plugin, to s3://<bucket>/<cluster>/ at endpoint. The token
# and region are sealed (noord-backup); the endpoint and bucket are not
# secret, and the ObjectStore takes them only as plain fields.
backup:
  enabled: false
  endpoint: ""   # https://<account>.eu.r2.cloudflarestorage.com on k3sprox
  bucket: ""
  retention: 14d
  # CNPG's six field cron (seconds first): 02:00 UTC daily.
  schedule: "0 0 2 * * *"

# The kill switch starts read only; flip it with kubectl (AC-9), never in git.
killSwitch:
  initial: read_only

migrate:
  waitTimeout: 5m
  backoffLimit: 6
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# The smoke check (AC-17), run on demand from the suspended CronJob.
smoke:
  timeout: 1m
  ttlSecondsAfterFinished: 3600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

toolserver:
  replicas: 1
  zammadDefaultGroup: IT Support
  # Other non secret settings by name, defaults from internal/config.
  env: {}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

agent:
  replicas: 1
  # Above AGENT_SHUTDOWN_GRACE (25s) so a running turn can finish (spec 0008).
  terminationGracePeriodSeconds: 40
  env: {}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

directory:
  samba:
    realm: AD.NOORD.EXAMPLE
    domain: NOORD
    lockout:
      threshold: 5
      duration: 15
      window: 15
    storage:
      size: 1Gi
    storageClass: ""   # empty: the cluster's default StorageClass
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  seed:
    waitTimeout: 5m
    backoffLimit: 6
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

# The demo helpdesk (component client, AC-10, AC-11): our Elasticsearch, the
# helpdesk seed Job, and the tailnet host of Zammad's web UI.
helpdesk:
  # The UI's tailnet host; empty means noord-<cluster>-helpdesk (AC-15).
  tailscaleHost: ""
  elasticsearch:
    image: elasticsearch:9.5.5
    heap: 1g
    storage:
      size: 5Gi
    storageClass: ""   # empty: the cluster's default StorageClass
    resources:
      requests: {cpu: 250m, memory: 1536Mi}
      limits: {cpu: "2", memory: 2Gi}
  seed:
    waitTimeout: 15m
    # A failed step leaves Zammad half seeded, so a retry only finds
    # needs_reset; the seed waits for Samba and Zammad itself.
    backoffLimit: 0
    # Zammad's Rails sizes: the seed runs Rails in process.
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    exportResources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

# The Zammad chart 20.0.0 (charts/), rendered only by the client Application,
# which sets enabled. Its own Postgres, Redis, and Memcached read their
# passwords from noord-zammad; ECK Elasticsearch and RustFS stay off.
zammad:
  enabled: false
  # Names the web Service zammad-nginx (the tool server's ZAMMAD_URL).
  fullnameOverride: zammad
  image:
    tag: 7.2.2-0012   # the chart's appVersion, pinned here so the seed Job runs the same image
  # Zammad after its databases (wave 0), before the seed Job (wave 2).
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "1"
  secrets:
    postgresql:
      useExisting: true
      secretName: noord-zammad
      secretKey: postgres-password
    redis:
      useExisting: true
      secretName: noord-zammad
      secretKey: redis-password
  zammadConfig:
    elasticsearch:
      enabled: false
      host: elasticsearch
      port: 9200
      schema: http
      initialisation: true
    rustfs:
      enabled: false
    postgresql:
      pass: ""
    redis:
      pass: ""
    initContainers:
      # A privileged root chmod of an emptyDir; baseline refuses it and
      # fsGroup already makes the tmp dir writable (AC-12).
      volumePermissions:
        enabled: false
    # Zammad's init runs as an ArgoCD hook on every sync: its name never
    # changes under ArgoCD, so as a plain Job a TTL delete would make it
    # drift and an image bump would hit its immutable spec.
    initJob:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # The demo CA for Zammad's LDAPS (the scheduler's LDAP sync included).
    customVolumes:
      - name: noord-ca
        configMap:
          name: noord-ca
          items:
            - {key: ca.crt, path: ca.pem}
    customVolumeMounts:
      - name: noord-ca
        mountPath: /opt/noord-seed
        readOnly: true
  postgres:
    auth:
      existingSecret: noord-zammad
      secretKeys:
        adminPasswordKey: postgres-password
  redis:
    auth:
      existingSecret: noord-zammad
      existingSecretPasswordKey: redis-password

# Observability (spec 0016): the Collector, Tempo, and Grafana, each its own
# Application (noord-collector, noord-tempo, noord-grafana) that turns on only
# its own chart below. The ConfigMaps they mount belong to noord-agent, which
# reads the files in files/observability/ (.Files can only read inside this
# chart). Everything is in noord-agent, so the Pod Security level is
# restricted and the default deny policy applies.
observability:
  enabled: true
  # Grafana's tailnet host; empty means noord-<cluster>-grafana (AC-11).
  tailscaleHost: ""
  tempo:
    retention: 168h   # 7 days of blocks, nothing else is backed up (AC-5)
    storage: 5Gi
    storageClass: ""  # empty: the cluster's default StorageClass

# The OpenTelemetry Collector chart 0.176.0 (alias collector). Its own default
# config is not used: configMap.existingName is noord-otel-collector, built
# from files/observability/collector.yaml, so the drift test checks the config
# that runs (AC-12). The contrib image carries the redaction processor.
collector:
  enabled: false
  nameOverride: otel-collector
  fullnameOverride: otel-collector
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.162.0
  command:
    name: otelcol-contrib
  configMap:
    create: false
    existingName: noord-otel-collector
  presets: {}
  # Only OTLP over HTTP is received (collector.yaml); the chart's other
  # default ports are closed.
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: true
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# The Tempo chart 1.24.0, single binary. Blocks on one PVC; the claim goes
# with the StatefulSet (traces are disposable). The chart's other receivers
# (Jaeger, OpenCensus, OTLP HTTP) listen but no policy reaches them: only the
# Collector's OTLP gRPC (4317) and Grafana's queries (3200) are allowed.
tempo:
  enabled: false
  fullnameOverride: tempo
  nameOverride: tempo
  tempo:
    reportingEnabled: false   # egress is denied; no usage report
    retention: 168h           # overridden from observability.tempo.retention by the Application
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  persistence:
    enabled: true
    size: 5Gi
    enableStatefulSetAutoDeletePVC: true
  # Tempo writes /tmp for its own scratch files; the root filesystem is read only.
  extraVolumes:
    - name: tmp
      emptyDir: {}

# The Grafana chart 10.5.11. No sidecar: the dashboard and the datasources are
# ConfigMaps from noord-agent. No persistence: users and state are code, and a
# changed admin Secret takes effect on restart (AC-12). Anonymous access and
# sign up are off; update checks and analytics are off (egress is denied).
grafana:
  enabled: false
  fullnameOverride: grafana
  nameOverride: grafana
  replicas: 1
  testFramework:
    enabled: false
  rbac:
    create: false
    pspEnabled: false
  serviceAccount:
    create: true
    autoMount: false
  persistence:
    enabled: false
  initChownData:
    enabled: false
  assertNoLeakedSecrets: false
  admin:
    existingSecret: noord-grafana
    userKey: GRAFANA_ADMIN_USER
    passwordKey: GRAFANA_ADMIN_PASSWORD
  # GRAFANA_DB_PASSWORD reaches the datasource file as $__env{...}.
  envFromSecret: noord-grafana
  env:
    TEMPO_URL: http://tempo:3200
    GRAFANA_DB_HOST: noord-pg-rw.noord-agent.svc:5432
    GRAFANA_DB_SSLMODE: verify-full
  grafana.ini:
    server:
      root_url: ""
    users:
      allow_sign_up: false
      allow_org_create: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    plugins:
      plugin_admin_enabled: false
    news:
      news_feed_enabled: false
    security:
      disable_gravatar: true
    paths:
      data: /var/lib/grafana
      plugins: /var/lib/grafana/plugins
  extraConfigmapMounts:
    - name: noord-grafana-datasources
      configMap: noord-grafana-datasources
      mountPath: /etc/grafana/provisioning/datasources
      readOnly: true
  # CloudNativePG's CA, for sslmode verify-full to noord-pg-rw.
  extraSecretMounts:
    - name: pg-ca
      secretName: noord-pg-ca
      mountPath: /etc/noord/pg-ca
      readOnly: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: noord
          folder: Noord
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/noord
  dashboardsConfigMaps:
    noord: noord-grafana-dashboards
  # The chart already mounts an emptyDir at /var/lib/grafana (no persistence).
  extraEmptyDirMounts:
    - name: grafana-tmp
      mountPath: /tmp
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  service:
    type: ClusterIP
