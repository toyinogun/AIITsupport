{{- if eq .Values.component "agent" }}
# Our own database (spec 0003): the owner from the initdb Secret, the app
# roles managed by the operator, so `seed migrate` finds them (AC-9).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: noord-pg
  namespace: noord-agent
  labels:
    {{- include "noord.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  bootstrap:
    initdb:
      database: noord
      owner: noord_owner
      secret:
        name: noord-pg-owner
  managed:
    roles:
      {{- range list "agent" "toolserver" "eval" }}
      # connectionLimit is CNPG's default, stated so the live role list
      # matches this one and ArgoCD does not show the Cluster OutOfSync.
      - name: noord_{{ . }}
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: noord-pg-{{ . }}
      {{- end }}
{{- end }}
