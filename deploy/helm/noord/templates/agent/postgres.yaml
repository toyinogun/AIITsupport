{{- if eq .Values.component "agent" }}
# Our own database (spec 0003): the owner from the initdb Secret, the app
# roles managed by the operator, so `seed migrate` finds them (AC-9).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: noord-pg
  namespace: noord-agent
  labels:
    {{- include "noord.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  {{- if .Values.backup.enabled }}
  # WAL goes to the ObjectStore as it is written (AC-18, backup.yaml).
  # enabled is CNPG's default, stated so the live Cluster matches and
  # ArgoCD does not show it OutOfSync (like connectionLimit below).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: noord-backup
  {{- end }}
  bootstrap:
    initdb:
      database: noord
      owner: noord_owner
      secret:
        name: noord-pg-owner
      # The dashboard's view only role (spec 0016, AC-9). A managed role cannot
      # carry a statement timeout, so a fresh database creates the role here
      # with it; the managed role below then sets its password and its
      # connection limit. An existing database needs the one ALTER ROLE in
      # docs/runbooks/observability.md.
      postInitSQL:
        - CREATE ROLE noord_grafana LOGIN NOINHERIT
        - ALTER ROLE noord_grafana SET statement_timeout = '10s'
  managed:
    roles:
      {{- range list "agent" "toolserver" "eval" }}
      # connectionLimit is CNPG's default, stated so the live role list
      # matches this one and ArgoCD does not show the Cluster OutOfSync.
      - name: noord_{{ . }}
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: noord-pg-{{ . }}
      {{- end }}
      # Grafana's view only role: at most five connections (AC-9). inherit is
      # off; it holds no membership.
      - name: noord_grafana
        ensure: present
        login: true
        inherit: false
        connectionLimit: 5
        passwordSecret:
          name: noord-pg-grafana
{{- end }}
