{{- if and (eq .Values.component "grafana") .Values.observability.enabled }}
# Grafana on the tailnet only (AC-11), per cluster so two clusters on one
# tailnet never collide; the login is the second layer. This Ingress belongs
# to the noord-grafana Application, next to the Service it points at. In
# noord-agent it waited for an address that needs a Service from a later
# Application, which kept noord-agent Progressing for good (journal 0086).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: noord-agent
  labels:
    {{- include "noord.labels" . | nindent 4 }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: grafana
      port:
        number: 80
  tls:
    - hosts:
        - {{ .Values.observability.tailscaleHost | default (printf "noord-%s-grafana" .Values.cluster.name) }}
{{- end }}
