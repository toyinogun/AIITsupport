{{- /* The directory seed Job's spec, rendered once: its hash names the Job
(AC-10), so any change to what it runs (an image, a value, seedRun) makes a
new Job, and a self heal never does. A plain Job, not a sync hook. The seed
files are in the image, so the tag covers them. */}}
{{- define "noord.seedDirectorySpec" -}}
{{- $seed := .Values.directory.seed }}
spec:
  backoffLimit: {{ $seed.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-directory
      annotations:
        # make resume bumps it, so the hash changes and the seed runs again.
        noord.example/seed-run: {{ .Values.seedRun | quote }}
    spec:
      restartPolicy: Never
      {{- include "noord.podSecurity" . | nindent 6 }}
      containers:
        - name: seed
          image: {{ include "noord.image" (list . "seed") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["directory"]
          env:
            - name: SEED_LDAP_URL
              value: ldaps://samba.noord-directory.svc.cluster.local:636
            - name: SEED_CA_CERT
              value: /etc/noord/ca/ca.crt
            - name: SEED_WAIT_TIMEOUT
              value: {{ $seed.waitTimeout | quote }}
            - name: SEED_OVERLAY_FILE
              value: /etc/noord/overlays/overlay.local.yaml
            - name: SEED_ENTRA_DEMO_FILE
              value: /etc/noord/overlays/demo.local.yaml
          envFrom:
            - secretRef:
                name: noord-seed-directory
          resources:
            {{- toYaml $seed.resources | nindent 12 }}
          {{- include "noord.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - name: ca
              mountPath: /etc/noord/ca
              readOnly: true
            - name: overlays
              mountPath: /etc/noord/overlays
              readOnly: true
      volumes:
        - name: ca
          configMap:
            name: noord-ca
        # Made by make install, never by git (AC-6); empty when there are no
        # overlays. Not optional: the pod waits until it exists.
        - name: overlays
          secret:
            secretName: noord-seed-overlays
{{- end -}}

{{- if eq .Values.component "directory" }}
{{- $spec := include "noord.seedDirectorySpec" . }}
{{- /* The spec, plus what it reads but does not show: the Secret's sealed
block and the directory values Samba was provisioned with. */}}
{{- $hash := list $spec (index .Values.sealed "noord-seed-directory") .Values.directory | toYaml | sha256sum | trunc 10 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-directory-{{ $hash }}
  namespace: noord-directory
  labels:
    {{- include "noord.labels" . | nindent 4 }}
    app.kubernetes.io/name: seed-directory
  annotations:
    argocd.argoproj.io/sync-wave: "2"
{{ $spec }}
{{- end }}
