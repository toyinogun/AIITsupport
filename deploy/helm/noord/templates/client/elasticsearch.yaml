{{- if eq .Values.component "client" }}
{{- $es := .Values.helpdesk.elasticsearch }}
# Zammad's search index (AC-10): one node, no mmap (so no vm.max_map_count
# on the node), no security, since only Zammad's pods reach it (AC-14).
# Wave 0, so it answers before Zammad's init builds the index.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: noord-client
  labels:
    {{- include "noord.labels" . | nindent 4 }}
    app.kubernetes.io/name: elasticsearch
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - {name: http, port: 9200, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: noord-client
  labels:
    {{- include "noord.labels" . | nindent 4 }}
    app.kubernetes.io/name: elasticsearch
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        {{- include "noord.labels" . | nindent 8 }}
        app.kubernetes.io/name: elasticsearch
    spec:
      automountServiceAccountToken: false
      # The image's own user, uid 1000 in group 0.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The root filesystem stays read only: the config dir (where the
      # keystore is written on start) is copied into an emptyDir first.
      initContainers:
        - name: config
          image: {{ $es.image }}
          command: ["cp", "-a", "/usr/share/elasticsearch/config/.", "/config/"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          {{- include "noord.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: config, mountPath: /config}
      containers:
        - name: elasticsearch
          image: {{ $es.image }}
          env:
            - {name: discovery.type, value: single-node}
            - {name: node.store.allow_mmap, value: "false"}
            - {name: xpack.security.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: {{ printf "-Xms%s -Xmx%s" $es.heap $es.heap | quote }}}
            - {name: ES_TMPDIR, value: /tmp}
          ports:
            - {name: http, containerPort: 9200}
          readinessProbe:
            httpGet: {path: "/_cluster/health?local=true", port: http}
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml $es.resources | nindent 12 }}
          {{- include "noord.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
            - {name: config, mountPath: /usr/share/elasticsearch/config}
            - {name: logs, mountPath: /usr/share/elasticsearch/logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, emptyDir: {}}
        - {name: logs, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $es.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $es.storage.size }}
{{- end }}
