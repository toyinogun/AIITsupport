{{- if eq .Values.component "client" }}
# Zammad's web UI on the tailnet only (AC-15): https://<host>.<TAILNET>,
# per cluster so two clusters on one tailnet never collide. The Tailscale
# proxy records no request paths.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk
  namespace: noord-client
  labels:
    {{- include "noord.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: zammad-nginx
      port:
        number: 8080
  tls:
    - hosts:
        - {{ .Values.helpdesk.tailscaleHost | default (printf "noord-%s-helpdesk" .Values.cluster.name) }}
{{- end }}
