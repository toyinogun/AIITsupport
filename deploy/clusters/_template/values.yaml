# One cluster's settings (spec 0015). Committed: no secret and no private
# value goes here; those are in secrets.env and sealed-values.yaml.

cluster:
  name: CHANGE_ME
  # The ranges the network policies keep internal; make cluster-init reads
  # them from the live cluster.
  podCIDR: 10.42.0.0/16
  serviceCIDR: 10.43.0.0/16
  nodeCIDR: CHANGE_ME
  apiServerCIDR: CHANGE_ME

# Set both when the cluster's CNI is Cilium: FQDN rules then narrow each
# workload's internet egress to the hosts it uses.
cilium:
  enabled: false
  fqdnEgress: false

# The repo and branch ArgoCD follows (make cluster-init reads them from origin).
repo:
  url: CHANGE_ME
  revision: main

# The images CI pushed for one commit on the default branch (AC-19).
image:
  registry: ghcr.io
  owner: CHANGE_ME
  tag: CHANGE_ME

# Noord's fictional Samba AD, Zammad, and seed data. Turn it off to point the
# tool server at your own directory and helpdesk.
demo:
  enabled: true

# The password reset page (spec 0011), on the tailnet at
# https://<tailscaleHost>.<TAILNET> (empty host: noord-<cluster>-reset).
# With demo off, it needs your directory's svc-pwreset account.
reset:
  enabled: true
  tailscaleHost: ""

# Operators the install adds (AC-4). Keep a part off when the cluster has it.
platform:
  sealedSecrets:
    enabled: true
    namespace: kube-system
    name: sealed-secrets-controller
  certManager:
    enabled: true
  cnpg:
    enabled: true
    namespace: cnpg-system
  barmanPlugin:
    enabled: true
  tailscale:
    enabled: true

postgres:
  storage:
    size: 5Gi

# Backups of the database to an S3 compatible bucket. The bucket's token and
# region go in secrets.env; the endpoint and bucket name here.
backup:
  enabled: false
  endpoint: ""
  bucket: ""

# The CA your directory's LDAPS certificate is signed by. make install writes
# it in demo mode.
ca:
  certificate: ""
