# k3sprox, the homelab cluster (spec 0015). Committed: no secret and no
# private value goes here; those are in secrets.env and sealed-values.yaml.

cluster:
  name: k3sprox
  # By hand until make cluster-init exists (task 8): the k3s pod and service
  # defaults, the four nodes, and the control plane's API.
  podCIDR: 10.42.0.0/16
  serviceCIDR: 10.43.0.0/16
  nodeCIDR: 172.16.70.0/24
  apiServerCIDR: 172.16.70.20/32
# k3sprox runs Cilium (kube proxy replacement), so FQDN egress rules work.
cilium:
  enabled: true
  fqdnEgress: true
repo:
  url: https://github.com/toyinogun/AIITsupport.git
  revision: main
# Set by make release (AC-19); by hand until it exists: the first main
# commit with /readyz, seed smoke, backups (tasks 5 to 7), and the seed's
# Zammad services step (journal 0076).
image:
  registry: ghcr.io
  owner: toyinogun
  tag: 78e3a7f511c4877aeafd3ad546549907dac29e38
# The demo directory (task 2) and helpdesk (task 3) run here.
demo:
  enabled: true
# The reset page (task 4). Samba makes svc-pwreset only when it provisions
# the domain, so turning it on went with a directory reset (AC-28).
reset:
  enabled: true
# Bumped by hand (make resume is task 9) to rerun every seed step: 1 after
# the directory reset for svc-pwreset (2026-10-22).
seedRun: 2
# k3sprox already runs Sealed Secrets, cert-manager, CNPG, and the Tailscale
# operator; the install adds only the Barman Cloud plugin (AC-4).
platform:
  sealedSecrets:
    enabled: false
    namespace: kube-system
    name: sealed-secrets-controller
  certManager:
    enabled: false
  cnpg:
    enabled: false
    namespace: cnpg-system
  barmanPlugin:
    enabled: true
  tailscale:
    enabled: false
postgres:
  storage:
    size: 5Gi
# Backups to the R2 bucket in the EU jurisdiction (AC-18), its token in
# secrets.env. Not secret: the endpoint holds the Cloudflare account id;
# the token and region are sealed.
backup:
  enabled: true
  endpoint: https://46cc20661b5d8547874081f7a5e40b39.eu.r2.cloudflarestorage.com
  bucket: noord-k3sprox-backups
