# The Noord IT assistant's Slack app (spec 0006). Paste this file into
# https://api.slack.com/apps -> Create New App -> From a manifest, in the
# "Noord Logistics" workspace. Steps: docs/runbooks/slack-workspace.md.
#
# Socket Mode means Slack never calls us: the agent dials out with the app
# level token (connections:write), so nothing listens on the internet.
# No token, workspace id, or email belongs in this file.
display_information:
  name: Noord IT Assistant
  description: Noord Logistics IT help. DM me or mention me in #it-help.
  background_color: "#1f4e79"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Noord IT Assistant
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
