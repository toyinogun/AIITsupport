{{- if eq .Values.part "apps" }}
# What our Applications may create: the three noord namespaces and, cluster
# wide, only Namespace objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: noord
  namespace: argocd
  labels:
    {{- include "apps.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The Noord install on {{ .Values.cluster.name }}
  sourceRepos:
    - {{ .Values.repo.url }}
  destinations:
    - {server: https://kubernetes.default.svc, namespace: noord-agent}
    - {server: https://kubernetes.default.svc, namespace: noord-directory}
    - {server: https://kubernetes.default.svc, namespace: noord-client}
    {{- if .Values.platform.tailscale.enabled }}
    # Only the Tailscale operator's SealedSecret goes here.
    - {server: https://kubernetes.default.svc, namespace: {{ .Values.tailscale.proxyNamespace }}}
    {{- end }}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
---
{{- $killSwitch := list (dict "group" "" "kind" "ConfigMap" "name" "noord-kill-switch" "namespace" "noord-agent" "jsonPointers" (list "/data")) }}
{{ include "apps.component" (dict "root" . "component" "agent" "namespace" "noord-agent" "wave" "0" "ignoreDifferences" $killSwitch) }}
{{- if .Values.observability.enabled }}
---
{{- /* Observability after the agent (its Secrets, ConfigMaps, and database
role): Tempo and the Collector first, Grafana last. Each Application turns on
only its own vendored chart. */}}
{{- /* Tempo's StatefulSet leaves apiVersion and kind out of its claim template,
like the Zammad chart's Postgres below (journal 0068). */}}
{{- $tempoClaim := list (dict "group" "apps" "kind" "StatefulSet" "name" "tempo" "namespace" "noord-agent" "jqPathExpressions" (list ".spec.volumeClaimTemplates[]?.apiVersion" ".spec.volumeClaimTemplates[]?.kind")) }}
{{ include "apps.component" (dict "root" . "component" "tempo" "namespace" "noord-agent" "wave" "1" "ignoreDifferences" $tempoClaim "values" (dict "tempo" (dict "enabled" true "tempo" (dict "retention" .Values.observability.tempo.retention) "persistence" (dict "size" .Values.observability.tempo.storage "storageClassName" .Values.observability.tempo.storageClass)))) }}
---
{{ include "apps.component" (dict "root" . "component" "collector" "namespace" "noord-agent" "wave" "1" "values" (dict "collector" (dict "enabled" true))) }}
---
{{ include "apps.component" (dict "root" . "component" "grafana" "namespace" "noord-agent" "wave" "2" "values" (dict "grafana" (dict "enabled" true))) }}
{{- end }}
{{- if .Values.demo.enabled }}
---
{{ include "apps.component" (dict "root" . "component" "directory" "namespace" "noord-directory" "wave" "0") }}
---
{{- /* The helpdesk after the directory: Zammad's LDAP source needs Samba.
The Zammad chart's Postgres StatefulSet leaves apiVersion and kind out of
its claim template; Kubernetes fills them in, which ArgoCD would show as a
diff forever. */}}
{{- $claimDefaults := list (dict "group" "apps" "kind" "StatefulSet" "jqPathExpressions" (list ".spec.volumeClaimTemplates[]?.apiVersion" ".spec.volumeClaimTemplates[]?.kind")) }}
{{ include "apps.component" (dict "root" . "component" "client" "namespace" "noord-client" "wave" "1" "values" (dict "zammad" (dict "enabled" true)) "ignoreDifferences" $claimDefaults) }}
{{- end }}
{{- end }}
