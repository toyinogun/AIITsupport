{{- if eq .Values.part "platform" }}
# What the platform part may create: the enabled operators' charts into their
# own namespaces, plus the cluster scoped kinds operators need (AC-4).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: noord-platform
  namespace: argocd
  labels:
    {{- include "apps.labels" . | nindent 4 }}
  annotations:
    # Before every operator Application (the lowest is -30): ArgoCD waits
    # for each one's health, and one whose repo the project does not yet
    # permit never turns healthy, so the sync would wait forever.
    argocd.argoproj.io/sync-wave: "-40"
spec:
  description: Operators for the Noord install on {{ .Values.cluster.name }}
  sourceRepos:
    - {{ .Values.repo.url }}
    {{- range $op := list "sealedSecrets" "certManager" "cnpg" "barmanPlugin" "tailscale" }}
    {{- $v := index $.Values.platform $op }}
    {{- if $v.enabled }}
    - {{ $v.repoURL }}
    {{- end }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.platform.cnpg.namespace }}
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.platform.sealedSecrets.namespace }}
    {{- if .Values.platform.certManager.enabled }}
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.platform.certManager.namespace }}
    # cert-manager keeps its leader election Role here.
    - server: https://kubernetes.default.svc
      namespace: kube-system
    {{- end }}
    {{- if .Values.platform.tailscale.enabled }}
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.tailscale.proxyNamespace }}
    {{- end }}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: cert-manager.io, kind: ClusterIssuer}
    - {group: networking.k8s.io, kind: IngressClass}

{{- if .Values.platform.sealedSecrets.enabled }}
---
# Sealed Secrets, key renewal off so one key backup stays good (AC-4, AC-22).
{{ include "platform.operator" (dict "root" . "key" "sealedSecrets" "app" "sealed-secrets" "wave" "-30" "namespace" .Values.platform.sealedSecrets.namespace "values" (printf "fullnameOverride: %s\nkeyrenewperiod: \"0\"" .Values.platform.sealedSecrets.name)) }}
{{- end }}
{{- if .Values.platform.certManager.enabled }}
---
{{ include "platform.operator" (dict "root" . "key" "certManager" "app" "cert-manager" "wave" "-30" "namespace" .Values.platform.certManager.namespace "values" "crds:\n  enabled: true") }}
{{- end }}
{{- if .Values.platform.cnpg.enabled }}
---
{{ include "platform.operator" (dict "root" . "key" "cnpg" "app" "cnpg" "wave" "-20" "namespace" .Values.platform.cnpg.namespace) }}
{{- end }}
{{- if .Values.platform.tailscale.enabled }}
---
# Its OAuth Secret arrives with the apps part, so this Application turns
# healthy only after that (the installer waits for it last).
{{ include "platform.operator" (dict "root" . "key" "tailscale" "app" "tailscale" "wave" "-10" "namespace" .Values.tailscale.proxyNamespace) }}
{{- end }}
{{- with .Values.platform.barmanPlugin }}
{{- if .enabled }}
---
# The Barman Cloud plugin, beside the CNPG operator, which finds it by its
# Service there (AC-4, AC-18).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noord-{{ $.Values.cluster.name }}-barman
  namespace: argocd
  labels:
    {{- include "apps.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: noord-platform
  source:
    repoURL: {{ .repoURL }}
    chart: {{ .chart }}
    targetRevision: {{ .version }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Values.platform.cnpg.namespace }}
  {{- include "apps.syncPolicy" $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
