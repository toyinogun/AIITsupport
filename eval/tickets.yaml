# Noord Logistics eval ticket set (spec 0017). Every person here is
# fictional. The 50 cases match the table in
# docs/specs/0017-eval-ticket-set/rationale.md (AC-13). The set is frozen
# by eval/tickets.lock after the first saved run (#21): after that, never edit
# this file; add a new numbered set instead.
version: 1
as_of: 2026-10-16
tickets:
