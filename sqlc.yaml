version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: queries
        out: internal/db/queries
        sql_package: pgx/v5
        # Type mapping (spec 0003). Money is bigint micro dollars, so there
        # is no numeric override; nullable timestamptz stays pgtype.Timestamptz.
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: github.com/google/uuid.NullUUID
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          - db_type: timestamptz
            go_type: time.Time
          - db_type: date
            go_type: time.Time
