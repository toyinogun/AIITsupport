# CI (spec 0002). One workflow; the ci-ok job is the one required check on main.
# Actions are pinned by full commit SHA; Dependabot keeps the pins current.
# Jobs run on ephemeral self-hosted runners in the k3sprox homelab cluster
# (ARC scale set k3sprox, linux/amd64): a fresh pod with its own dockerd per
# job. Only a push to main or a pull request whose head is this repo runs
# there; anything else (a fork, or a fork deleted since, whose head repo is
# null) runs on ubuntu-latest, so code from outside the repo never runs in
# the cluster. Setup: docs/runbooks/ci-runner.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run. Runs on main never
# cancel each other: a seal or release commit right after a code push must
# not cancel the run that pushes that commit's images (spec 0015, AC-19).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Use exactly the toolchain setup-go installed; never download another one.
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'k3sprox' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-key: ${{ github.job }}
      - run: make lint
      - run: go tool -modfile=tools.mod lefthook validate

  test:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'k3sprox' || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        # Keep in sync with compose.yaml; the first step below checks it.
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: noord
          POSTGRES_PASSWORD: noord-dev
          POSTGRES_DB: noord
        # A random host port, so the job never depends on 5432 being free.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U noord -d noord"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Builds the Samba image and runs the live directory tests (spec 0004, AC-19).
      TEST_SAMBA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Postgres image matches compose.yaml
        run: |
          want=$(awk '$1 == "image:" && $2 ~ /^postgres:/ { print $2 }' compose.yaml)
          if [ "$want" != "postgres:17.6-alpine" ]; then
            echo "::error::compose.yaml uses $want, but this job uses postgres:17.6-alpine"
            exit 1
          fi
      - uses: ./.github/actions/setup-go
        with:
          cache-key: ${{ github.job }}
      - run: go test -race -coverprofile=coverage.out ./...
        env:
          # -race needs cgo. Go quietly turns cgo off when it finds no C
          # compiler; forcing it on makes a missing gcc fail by name.
          CGO_ENABLED: "1"
          # A superuser URL: internal/db/dbtest creates the roles and a migrated
          # scratch database per test, so no migration step runs here. The job
          # context (for the mapped port) is only available at step level.
          TEST_DATABASE_URL: postgres://noord:noord-dev@localhost:${{ job.services.postgres.ports['5432'] }}/noord?sslmode=disable
      - name: Report coverage (never fails the job)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')
          echo "Total statement coverage: **${total}**" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  generated:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'k3sprox' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-key: ${{ github.job }}
      - run: make gen-check
      - run: make tidy-check

  vuln:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'k3sprox' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-key: ${{ github.job }}
      - run: make vuln

  secrets:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'k3sprox' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-key: ${{ github.job }}
      - run: make secrets

  # The four images (spec 0015, AC-19): built for both arches on every run,
  # pushed to ghcr.io/<owner>/aiitsupport-<name>:<full SHA> only on a push to
  # main. A change only under deploy/clusters/ (a seal or release commit)
  # builds nothing; the job still succeeds, so ci-ok stays green.
  images:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'k3sprox' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            target: app
          - name: toolserver
            target: app
          - name: seed
            target: seed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: Skip a change only under deploy/clusters, name the image
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          OWNER: ${{ github.repository_owner }}
        run: .github/scripts/image-plan.sh "$BASE" "$GITHUB_SHA" "$OWNER" "${{ matrix.name }}"
      - if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.plan.outputs.build == 'true' && github.event_name == 'push'
        name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The Dockerfile cross compiles from $BUILDPLATFORM, so no QEMU is needed.
      # Build first, push second. BuildKit drops the client's session after
      # two missed health checks (about 30s); a long compile on a busy node
      # misses them, and the push then has no session to fetch the GHCR
      # credentials through. The build needs no session once its context is
      # sent, and the push reruns from the builder's cache with a fresh one
      # (journal 0070).
      - if: steps.plan.outputs.build == 'true'
        name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: CMD=${{ matrix.name }}
          tags: ${{ steps.plan.outputs.image }}
      - if: steps.plan.outputs.build == 'true' && github.event_name == 'push'
        name: Push from the build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: CMD=${{ matrix.name }}
          tags: ${{ steps.plan.outputs.image }}
          push: true

  samba-image:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'k3sprox' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: Skip a change only under deploy/clusters, name the image
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          OWNER: ${{ github.repository_owner }}
        run: .github/scripts/image-plan.sh "$BASE" "$GITHUB_SHA" "$OWNER" samba
      # The image's apt step runs per arch, so arm64 is built under QEMU (AC-18).
      - if: steps.plan.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.plan.outputs.build == 'true' && github.event_name == 'push'
        name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: seed/directory/samba
          file: seed/directory/samba/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.plan.outputs.image }}
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=samba
          cache-to: type=gha,scope=samba,mode=max

  ci-ok:
    if: always()
    needs: [lint, test, generated, vuln, secrets, images, samba-image]
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'k3sprox' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job ended as $r"
              exit 1
            fi
          done
