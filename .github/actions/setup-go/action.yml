name: Set up Go
description: >
  Installs the Go toolchain from go.mod, restores this job's own module and
  build cache (tool builds included), and fails unless the toolchain matches
  the go.mod toolchain line.
inputs:
  cache-key:
    description: The job id, so each job keeps its own tool builds.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ inputs.cache-key }}-${{ runner.os }}-${{ hashFiles('go.sum', 'tools.sum') }}
        restore-keys: ${{ inputs.cache-key }}-${{ runner.os }}-
    - name: Check the Go toolchain
      shell: bash
      run: |
        want=$(awk '$1 == "toolchain" { print $2 }' go.mod)
        got=$(go env GOVERSION)
        go version
        if [ "$got" != "$want" ]; then
          echo "::error::Go is $got, but go.mod's toolchain line says $want"
          exit 1
        fi
