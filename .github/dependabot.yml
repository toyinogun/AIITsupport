# Weekly updates, minor and patch grouped into one PR per ecosystem (spec 0002).
# tools.mod is invisible to Dependabot: bump those tools by hand.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /
      - /seed/directory/samba
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
