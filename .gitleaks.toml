# Secret scanning (spec 0002). Every gitleaks call passes --config .gitleaks.toml.
# .env.example holds only placeholders: a finding there is a real problem to
# fix, never something to allowlist.

[extend]
useDefault = true

[[allowlists]]
description = "Vendored Agent Skill docs carry example keys"
paths = ['''^\.claude/skills/''']

[[allowlists]]
# The default config skips go.mod and go.sum by name only, so the tool
# module's checksum file (journal 0010) needs the same pass.
description = "tools.mod and tools.sum hold module checksums, not secrets"
paths = ['''(?:^|/)tools\.(?:mod|sum)$''']

[[allowlists]]
# make install commits sealed-values.yaml with the hooks off (spec 0015,
# AC-5), so only this scan sees it. Sealed Secrets ciphertext is public by
# design and only that cluster's controller can open it (journal 0065). Both
# conditions must hold: the file is a cluster's sealed-values.yaml AND the
# line is one key holding ciphertext (kubeseal's output starts "Ag" and runs
# hundreds of base64 characters). A plaintext value pasted there still fails.
description = "Sealed Secrets ciphertext in a cluster's sealed-values.yaml"
condition = "AND"
paths = ['''^deploy/clusters/[a-z][a-z0-9-]*/sealed-values\.yaml$''']
regexTarget = "line"
regexes = ['''^\s+[A-Za-z0-9_]+: Ag[A-Za-z0-9+/]{300,}={0,2}$''']
