# Local development environment. Zammad (spec 0006) comes in through the
# include below; every Zammad service carries the profile `helpdesk`, so
# `make dev` and `make db-up` never start it.
# Credentials here are for a throwaway local database only; the Samba
# passwords come from .env (spec 0004).
name: noord

include:
  - path:
      - seed/helpdesk/zammad/compose.yaml
      - seed/helpdesk/zammad/override.yaml
    env_file: seed/helpdesk/zammad/zammad.env

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: noord
      POSTGRES_PASSWORD: noord-dev
      POSTGRES_DB: noord
    ports:
      # 55432 on the host so it never collides with a Postgres already on 5432.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noord -d noord"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the app roles on a fresh volume; `make db-roles` does it for an existing one.
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro

  samba:
    # Noord's fictional on prem directory (spec 0004). No volume on purpose:
    # the container's own filesystem is the whole state, so `make
    # directory-reset` replaces the container to rebuild from scratch.
    build: seed/directory/samba
    image: noord-samba:dev
    hostname: samba
    environment:
      SAMBA_REALM: AD.NOORD.EXAMPLE
      SAMBA_DOMAIN: NOORD
      SAMBA_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SAMBA_SVC_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      SAMBA_ZAMMAD_PASSWORD: ${SEED_ZAMMAD_BIND_PASSWORD:-}
      # svc-pwreset (spec 0011); unset means no account and no reset rights.
      SAMBA_PWRESET_PASSWORD: ${RESET_LDAP_BIND_PASSWORD:-}
      SAMBA_LOCKOUT_THRESHOLD: 5
      SAMBA_LOCKOUT_DURATION: 15
      SAMBA_LOCKOUT_WINDOW: 15
    # Docker's default set already holds NET_BIND_SERVICE; NT ACLs live in
    # user.NTACL, so no CAP_SYS_ADMIN (AC-17).
    cap_add: []
    ports:
      # LDAPS only, on loopback (AC-12).
      - "127.0.0.1:55636:636"
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/certs/ca.pem ldapsearch -H ldaps://localhost:636 -x -b '' -s base >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 90s
    volumes:
      - ./.dev/certs:/certs:ro

  # Observability profile (spec 0016): `make obs-up`. Same base config files
  # the chart uses, mounted from deploy/helm/noord/files/observability/.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.162.0
    command:
      - --config=/etc/otelcol/collector.yaml
      - --config=/etc/otelcol/debug.yaml
    volumes:
      - ./deploy/helm/noord/files/observability/collector.yaml:/etc/otelcol/collector.yaml:ro
      - ./deploy/compose/observability.debug.yaml:/etc/otelcol/debug.yaml:ro
    ports:
      - "127.0.0.1:54318:4318"
    depends_on: [tempo]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"
    volumes:
      - ./deploy/helm/noord/files/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo

  grafana:
    profiles: [observability]
    image: grafana/grafana-oss:12.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: noord-dev
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TEMPO_URL: http://tempo:3200
      # The view only role (db/roles.sql); no TLS on the Compose network.
      GRAFANA_DB_HOST: postgres:5432
      GRAFANA_DB_PASSWORD: noord-dev
      GRAFANA_DB_SSLMODE: disable
    volumes:
      - ./deploy/helm/noord/files/observability/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/helm/noord/files/observability/dashboards.yaml:/etc/grafana/provisioning/dashboards/noord.yaml:ro
      - ./deploy/helm/noord/files/observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:53000:3000"
    depends_on: [tempo, postgres]

volumes:
  pgdata:
  tempodata:
